rejected_hits:
  note: >-
    symphonyhealth.com (acquired by HealthVerity 2026-05-08) answers HTTP 200 with
    the same WordPress homepage HTML for EVERY path probed, including
    /.well-known/agent-card.json, /openapi.json and /llms.txt. These are soft-404s,
    not documents. They are recorded here so a future round does not mistake the
    catch-all for a served discovery surface.
  entries:
  - host: symphonyhealth.com
    paths: ['/.well-known/agent-card.json', '/.well-known/agent.json', '/.well-known/api-catalog', '/openapi.json', '/swagger.json', '/llms.txt']
    status: 200
    content_type: text/html; charset=UTF-8
    verdict: soft-404 HTML catch-all - rejected
notes: >-
  Only a RFC 9116 security.txt is genuinely served, and only on the apex host. No
  OIDC or OAuth discovery, no RFC 9727 api-catalog, no ai-plugin, no SMART-on-FHIR
  configuration, no MCP manifest and no A2A agent card on any host - consistent with
  HealthVerity being a gated, sales-led RWD/de-identification platform with no public
  developer portal and no machine-readable API contract. The `WellKnown` pointer in
  apis.yml is justified by the one real 200 (security.txt); every other row is a
  recorded absence.
