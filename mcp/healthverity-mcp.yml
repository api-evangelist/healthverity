source: >-
  Live probes of every resolving HealthVerity host (2026-08-15) plus web search
  for a HealthVerity MCP server or agent endpoint.
summary: >-
  HealthVerity ships NO Model Context Protocol server - neither a remote endpoint
  nor a local stdio package. mcp.healthverity.com does not resolve;
  /.well-known/mcp.json returns 404 on healthverity.com, blog.healthverity.com and
  marketplace.healthverity.com; no @healthverity or healthverity-mcp package exists
  on npm or PyPI; and no MCP server appears in any public MCP registry. HealthVerity
  eXOs is an agentic-AI product, but it is an END-USER platform, not an agent
  surface: its published Terms of Use grant only a "non-transferable,
  non-assignable and non-exclusive sublicense to access the Content described in
  the Order exclusively within the Platform" and state that "Customer will not copy,
  extract, export or download any Content from the Platform" - the opposite of a
  programmatic tool surface. No candidate tool list could be derived either, because
  HealthVerity publishes no OpenAPI to derive operations from.
