name: HealthVerity
kind: company
description: >-
  HealthVerity is a United States life-sciences data platform, headquartered in
  Philadelphia, Pennsylvania, that operates what it describes as the nation's
  largest real-world data (RWD) ecosystem - more than 150 billion de-identified
  transactions covering over 330 million U.S. patients across 75-plus data
  sources spanning medical and pharmacy claims, labs, and EHR (following its
  integration of Symphony Health). Its products are organized around the IPGE
  framework (Identity, Privacy, Governance, Exchange) and include HealthVerity
  Marketplace (verified RWD datasets), Identity Manager and Census (privacy-safe
  probabilistic identity resolution that replaces PII with a universal
  HealthVerity ID / HVID), Governance Manager, HealthVerity FLOW, and eXOs (an
  AI-native real-world-evidence agent). HealthVerity is a HIPAA-aligned,
  tokenization-and-de-identification company serving pharma, payers, and
  government - not a self-serve, standards-based clinical interoperability
  vendor. Unlike EHR and FHIR-network players, it exposes no public developer
  portal, no FHIR CapabilityStatement, and no downloadable OpenAPI; the only
  vendor-named programmatic surface is the gated, enterprise HealthVerity
  Identity API for real-time de-identification, described conceptually on the
  Identity Manager product page but without public reference documentation,
  base URL, or self-serve onboarding.
