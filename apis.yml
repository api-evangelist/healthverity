apis:
- aid: healthverity:healthverity-identity-api
  name: HealthVerity Identity API
  description: >-
    Gated, enterprise real-time de-identification API named on the HealthVerity
    Identity Manager product page. Under the "sync on demand" modality,
    customers write records to the HealthVerity Identity API and records are
    processed in real time, replacing PII with a universal HealthVerity ID
    (HVID) while all PII remains with the data owner. No public reference
    documentation, base URL, authentication details, or self-serve onboarding
    are published; access is via a commercial/partner agreement.
  humanURL: https://healthverity.com/identity-manager/
