summary: >-
  HealthVerity publishes no API lifecycle surface of any kind. There is no status
  page, no changelog or release notes, no versioning policy, no deprecation or
  sunset policy, and no published SLA. This is consistent with there being no
  public API contract to version in the first place: the HealthVerity Identity API
  is gated and undocumented, and eXOs, Marketplace, FLOW and Governance Manager are
  end-user platforms reached through marketplace.healthverity.com behind a login.
  Every field below is a measured absence, not an unchecked field.
