      status: "200 (org has 9 open-source utility/fork repos - cantor, cassandra-loader, snakeskin-fabric, safeexec, ember-cli-react, datahub, pydruid, create-single-spa, safe-harbor-data-provider-tools; no API spec or SDK)"
    - url: https://healthverity.com/privacy-policy/
      status: "200"
    - url: https://healthverity.com/terms-and-conditions/
      status: "200"
    - url: https://healthverity.com/contact/
