  fhirCapabilityStatement:
    present: false
    version: null
    resources: []
    note: HealthVerity does not operate a FHIR server; no /metadata CapabilityStatement or /.well-known/smart-configuration exists.
  downloadableSpecs:
    count: 0
    provenance: none
    note: No OpenAPI/Swagger/CapabilityStatement was found or harvested. openapi/ contains only a README stub explaining the absence.
  authModel:
    scheme: none-documented
    smartOnFhir: false
    note: >-
      No public authentication documentation. The gated HealthVerity Identity
      API and all data products are accessed under commercial/partner agreements
      (sales-led). No SMART-on-FHIR scopes, OAuth2 client-credentials, API-key,
      or mTLS scheme is publicly documented.
  standardsConformance:
    usCore: false
    ukCore: false
    auCore: false
    daVinci: false
    carin: false
    note: Not applicable - HealthVerity is a RWD/de-identification/tokenization platform, not an EHR/FHIR-network or payer FHIR API.
  gatedVsSelfServe: gated
  homeMarket: United States
  transports:
    - protocol: REST
      scheme: https
      note: The HealthVerity Identity API is described as a real-time write interface but is gated with no documented base URL or endpoints.
      documented: false
    - protocol: FHIR
      scheme: https
      documented: false
      note: No FHIR REST surface, base URL, or CapabilityStatement is documented.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented.
sources:
  - url: https://healthverity.com/
    type: Website
    note: Positioned as "the healthcare data platform built for breakthroughs" - a RWD ecosystem; directs users to request a demo / contact sales; no developer resources.
  - url: https://healthverity.com/identity-manager/
    type: Documentation
    note: Names the HealthVerity Identity API under "sync on demand"; no reference docs, endpoints, or auth.
  - url: https://healthverity.com/ipge-approach/
    type: Documentation
    note: IPGE framework (Identity, Privacy, Governance, Exchange); RWD ecosystem scale (150B+ transactions, 330M+ patients, 75+ sources).
  - url: https://github.com/healthverity
    type: GitHubOrganization
    note: 9 open-source utility/fork repos; no public API specification or SDK.
actions:
  status: built-stub
  reason: |
    Identity captured with an honest, gated, undocumented programmatic surface.
    No public developer portal, FHIR CapabilityStatement, or OpenAPI exists to
    harvest, so none were fabricated. The single apis[] entry (HealthVerity
    Identity API) is a real, vendor-named API pointed only at its product page.
