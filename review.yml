    - url: https://docs.healthverity.com
      status: "000 (no DNS / connection failed)"
    - url: https://fhir.healthverity.com
      status: "000 (no DNS / connection failed)"
    - url: https://api.healthverity.com
      status: "000 (no DNS / connection failed)"
    - url: https://healthverity.com/developers
      status: "404"
    - url: https://healthverity.com/api
      status: "404"
    - url: https://healthverity.com/interoperability
      status: "404"
    - url: https://status.healthverity.com
      status: "000 (no DNS / connection failed)"
    - url: https://healthverity.com/identity-manager/
      status: "200 (product page; names the HealthVerity Identity API, no reference docs)"
    - url: https://healthverity.com/
