aid: healthverity
name: HealthVerity
review:
  question: Does HealthVerity expose a public developer portal, a FHIR CapabilityStatement, or a downloadable OpenAPI?
  answer: false
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: United States
findings:
  summary: |
    HealthVerity is a United States life-sciences real-world data (RWD)
    platform - identity resolution, de-identification/tokenization, and a data
    marketplace for pharma, payers, and government - not a standards-based
    clinical interoperability vendor. It publishes NO public developer portal,
    NO FHIR CapabilityStatement, and NO downloadable OpenAPI/Swagger. Every
    candidate developer host failed to resolve or returned an error
    (developer.healthverity.com, docs.healthverity.com, fhir.healthverity.com,
    api.healthverity.com all DNS/connection-fail; healthverity.com/developers,
    /api, /interoperability all 404). The only vendor-named programmatic
    surface is the "HealthVerity Identity API" mentioned conceptually on the
    Identity Manager product page ("Customers write to the HealthVerity
    Identity API and records are processed in real time, with all PII remaining
    with the data owner") under its "sync on demand" modality - but with no
    reference docs, base URL, endpoints, auth details, or self-serve onboarding.
    Access to all products is sales-/partner-gated (request a demo, contact
    sales). Because HealthVerity is a RWD/tokenization company rather than an
    EHR or FHIR-network participant, no US Core / SMART-on-FHIR / Da Vinci /
    CARIN conformance applies. This is an honest identity-only, gated-API
    result: a built-stub.
  developerPortal:
    url: ""
    confirmed: false
    note: No developer/docs/fhir/api subdomain resolves; /developers, /api, /interoperability all 404.
  probedHosts:
