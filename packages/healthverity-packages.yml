      a HealthVerity API client. Last released 2019-08-20; the GitHub repo was
      last pushed 2026-04-13. Nearly seven years without a release is a strong
      abandonment signal for the package as distributed.
  - language: python
    registry: pypi
    name: pydruid
    url: https://pypi.org/project/pydruid/
    repository: https://github.com/druid-io/pydruid
    author: Druid Developers
    official: false
