source: >-
  Registry queries against pypi.org/pypi/<pkg>/json, registry.npmjs.org and
  api.github.com/orgs/healthverity/repos (2026-08-15), plus the HealthVerity
  website sitemap and product pages.
api_client_sdk_count: 0
summary: >-
  HealthVerity publishes NO first-party client library for any HealthVerity API.
  The gated HealthVerity Identity API has no SDK on npm, PyPI, Maven Central,
  NuGet, RubyGems, crates.io, Packagist or pkg.go.dev. The github.com/healthverity
  organization holds 9 repositories, all of which are general-purpose
  infrastructure utilities or forks - none of them wrap a HealthVerity API. The
  Identity Manager product page describes activation as "a pre-configured java
  application or API", but that Java application is distributed under a
  commercial/partner agreement and is not published to any public registry.
  Because no official API client library exists, NO `SDKs` pointer is emitted in
  apis.yml - only `Packages`, which records this measured absence.
packages: []
first_party_open_source:
  note: >-
    These are HealthVerity-authored or HealthVerity-forked open-source projects
    found on the public registries. They are recorded for provenance only. None of
    them is a client for a HealthVerity API, so none counts toward sdk_count and
    none is marked as an API client.
  entries:
