    version: 0.6.9
    published: '2024-05-16'
    note: >-
      Apache Druid connector forked into the HealthVerity GitHub org. Upstream is
      druid-io/pydruid; HealthVerity is not the publisher. Recorded so the fork is
      not mistaken for a first-party SDK.
