summary: >-
  HealthVerity asserts a privacy and de-identification posture rather than an API
  standards posture. It positions itself as HIPAA-aligned through expert
  determination / de-identification methodology and references NIST de-identification
  guidance, but names no third-party certification or attestation on any public page -
  no SOC 2, HITRUST, ISO 27001 or FedRAMP badge is published, and a targeted search
  found none. No API-level standard applies: there is no OAuth 2.0 or OIDC discovery
  document, no FHIR server or CapabilityStatement, no SCIM, OData, JSON:API,
  RFC 9457 problem+json, documented pagination or idempotency surface. Because no
  certification program is published, NO `Compliance` pointer is emitted - consistent
  with security/healthverity-trust-center.yml.
